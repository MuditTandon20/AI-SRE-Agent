global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
scrape_configs:
  - job_name: demo
    static_configs:
      - targets: ['demo:8001']
  - job_name: agent
    static_configs:
      - targets: ['api:8000']
