apiVersion: batch/v1
kind: Job
metadata:
  name: ai-sre-migrate
  namespace: ai-sre
spec:
  backoffLimit: 1
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: migrate
          image: ai-sre-agent:0.1.0-dev
          command: [python, -m, ai_sre_agent.migrate]
          envFrom:
            - configMapRef: {name: ai-sre-config}
            - secretRef: {name: ai-sre-secrets}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
