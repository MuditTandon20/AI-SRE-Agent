apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-sre
  namespace: ai-sre
spec:
  podSelector:
    matchLabels: {app: ai-sre}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ai-sre}
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    # Review destination selectors/CIDRs for your installation before production.
    - ports: [{protocol: TCP, port: 5432}, {protocol: TCP, port: 9090}, {protocol: TCP, port: 3100}, {protocol: TCP, port: 3200}, {protocol: TCP, port: 443}]
