name: ai-sre-lab
x-app: &app
  build:
    context: ..
  env_file:
    - ../.env
    - ../.demo/lab.env
  environment: &environment
    POSTGRES_HOST: db
    POSTGRES_PORT: '5432'
    PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
    LOKI_URL: ${LOKI_URL:-http://loki:3100}
    TEMPO_URL: ${TEMPO_URL:-http://tempo:3200}
    EXECUTION_MODE: ${EXECUTION_MODE:-fixture}
  restart: unless-stopped
services:
  db:
    image: postgres:16.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [labdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    <<: *app
    command: [python, -m, ai_sre_agent.migrate]
    restart: 'no'
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ['127.0.0.1:8010:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/ready")']
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    <<: *app
    command: [python, -m, ai_sre_agent.worker]
    healthcheck:
      test: [CMD, python, -c, "import time; from pathlib import Path; assert time.time()-float(Path('/tmp/ai-sre-heartbeat').read_text())<180"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}
  demo:
    <<: *app
    profiles: [demo]
    command: [python, -m, uvicorn, ai_sre_agent.demo:app, --host, 0.0.0.0, --port, '8001']
    environment:
      <<: *environment
      DEMO_LOG_DIR: /logs
      DEMO_OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
      # Pool-exhaustion uses a real PostgreSQL pool when this optional URL is supplied.
      DEMO_DATABASE_URL: ${DEMO_DATABASE_URL:-}
    volumes: [demologs:/logs]
    ports: ['127.0.0.1:8001:8001']
  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [demo]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ['127.0.0.1:9091:9090']
  alertmanager:
    image: prom/alertmanager:v0.28.1
    profiles: [demo]
    volumes:
      - ../.demo/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ['127.0.0.1:9094:9093']
  loki:
    image: grafana/loki:3.4.2
    profiles: [demo]
    command: [-config.file=/etc/loki/local-config.yaml]
    ports: ['127.0.0.1:3100:3100']
  alloy:
    image: grafana/alloy:v1.7.5
    profiles: [demo]
    command: [run, /etc/alloy/config.alloy]
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - demologs:/logs:ro
  tempo:
    image: grafana/tempo:2.7.2
    profiles: [demo]
    command: [-config.file=/etc/tempo.yaml]
    volumes: [./tempo.yml:/etc/tempo.yaml:ro]
    ports: ['127.0.0.1:3200:3200']
  executor:
    <<: *app
    profiles: [remediation]
    command: [python, -m, uvicorn, ai_sre_agent.executor:app, --host, 0.0.0.0, --port, '8002']
    environment:
      <<: *environment
      DEMO_CONTROL_URL: http://demo:8001
    depends_on:
      migrate: {condition: service_completed_successfully}
volumes:
  labdata:
  demologs:
