name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sre_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: sre_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sre_test -d sre_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sre_test:ci-only-password@localhost:5432/sre_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -c constraints.txt -r requirements-dev.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python -m ai_sre_agent.evaluate --output artifacts/benchmark.json
      - run: docker build -t ai-sre-agent:ci .
        if: matrix.python-version == '3.12'
