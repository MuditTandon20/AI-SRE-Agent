name: Feature request
description: Propose a developer workflow or integration improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended user
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Proposed behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and relevant roadmap milestone
